    <div id="player"></div>

<script>

const player =
    document.getElementById("player");

const game =
    document.getElementById("game");

const scoreText =
    document.getElementById("score");

const gameover =
    document.getElementById("gameover");

const finalScore =
    document.getElementById("finalScore");

const lanes = [100, 200, 300];

let lane = 1;
let score = 0;
let speed = 5;
let enemies = [];
let running = true;
let lastTime = 0;
let spawnTime = 0;
let lineY = 0;


function updatePlayer() {

    player.style.left =
        (lanes[lane] - 25) + "px";
}


function left() {

    if (!running) return;

    if (lane > 0) {
        lane--;
        updatePlayer();
    }
}


function right() {

    if (!running) return;

    if (lane < 2) {
        lane++;
        updatePlayer();
    }
}


/* کنترل کیبورد */

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft") {
        left();
    }

    if (e.key === "ArrowRight") {
        right();
    }

});


/* ساخت ماشین */

function createEnemy() {

    let enemyLane =
        Math.floor(Math.random() * 3);

    let enemy =

    enemy.className = "enemy";

    enemy.style.left =
        (lanes[enemyLane] - 25) + "px";

    enemy.style.background =
        ["red","yellow","purple","orange"]
        [Math.floor(Math.random() * 4)];

    enemy.style.top = "-100px";

    game.appendChild(enemy);

    enemies.push({
        element: enemy,
        lane: enemyLane,
        y: -100
    });
}


/* برخورد */

function collision(a, b) {

    let A = a.getBoundingClientRect();
    let B = b.getBoundingClientRect();

    return !(
        A.right < B.left ||
        A.left > B.right ||
        A.bottom < B.top ||
        A.top > B.bottom
    );
}

    enemies.forEach(e => {
        e.element.remove();
    });

    enemies = [];

    score = 0;
    speed = 5;
    lane = 1;
    spawnTime = 0;

    scoreText.innerText =

    gameover.style.display =

function loop(time) {

    if (!running) return;

    let delta =
        time - lastTime;

    lastTime = time;

    /* حرکت خطوط */

    lineY += speed;

    if (lineY > 60)
        lineY = 0;

        .style.top = lineY + "px";

    for (let enemy of enemies) {

        enemy.y +=
            speed * delta / 16;

            enemy.y + "px";


        if (

        ) {

                speed += 0.5;

            return false;

        return true;

    performance.now();
