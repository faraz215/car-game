<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>پژو 405 | بزرگراه همت</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}

#game {
  position: fixed;
  inset: 0;
}

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 10;
  color: white;
  background: rgba(0,0,0,.65);
  padding: 12px 16px;
  border-radius: 15px;
  font-size: 17px;
  line-height: 1.8;
}

#title {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 10;
  color: white;
  background: rgba(0,0,0,.65);
  padding: 8px 12px;
  border-radius: 12px;
  font-weight: bold;
}

#controls {
  position: fixed;
  bottom: 18px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 0 18px;
  z-index: 20;
}

.group {
  display: flex;
  gap: 10px;
}

button {
  width: 68px;
  height: 68px;
  border: none;
  border-radius: 20px;
  background: rgba(255,255,255,.85);
  font-size: 29px;
  box-shadow: 0 5px 12px rgba(0,0,0,.5);
}

button:active {
  transform: scale(.9);
}

#gameOver {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.78);
  color: white;
  text-align: center;
  padding-top: 25vh;
}

#gameOver h1 {
  font-size: 42px;
}

#restart {
  width: 190px;
  font-size: 20px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="title">
🚘 پژو ۴۰۵ | بزرگراه همت
</div>

<div id="hud">
💨 سرعت: <span id="speed">0</span> km/h<br>
🏆 امتیاز: <span id="score">0</span>
</div>

<div id="controls">

  <div class="group">
    <button id="left">⬅️</button>
    <button id="right">➡️</button>
  </div>

  <div class="group">
    <button id="brake">⬇️</button>
    <button id="gas">⬆️</button>
  </div>

</div>

<div id="gameOver">
  <h1>💥 تصادف!</h1>
  <p>امتیاز شما: <span id="finalScore">0</span></p>
  <button id="restart">🔄 دوباره بازی</button>
</div>


<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   شروع Three.js
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
  0x87ceeb,
  80,
  300
);


/* دوربین */

const camera = new THREE.PerspectiveCamera(
  65,
  window.innerWidth / window.innerHeight,
  0.1,
  500
);

camera.position.set(0, 5, 11);

camera.lookAt(0, 1, -20);


/* رندر */

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* نور */

const ambient = new THREE.HemisphereLight(
  0xffffff,
  0x555555,
  2
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
  0xffffff,
  2
);

sun.position.set(
  30,
  50,
  20
);

scene.add(sun);


/* =========================
   زمین
========================= */

const grassGeometry =
  new THREE.PlaneGeometry(
    500,
    500
  );

const grassMaterial =
  new THREE.MeshLambertMaterial({
    color: 0x397a36
  });

const grass =
  new THREE.Mesh(
    grassGeometry,
    grassMaterial
  );

grass.rotation.x = -Math.PI / 2;
grass.position.y = -0.15;

scene.add(grass);


/* =========================
   جاده
========================= */

const roadGeometry =
  new THREE.PlaneGeometry(
    22,
    500
  );

const roadMaterial =
  new THREE.MeshLambertMaterial({
    color: 0x303030
  });

const road =
  new THREE.Mesh(
    roadGeometry,
    roadMaterial
  );

road.rotation.x = -Math.PI / 2;
road.position.y = 0;

scene.add(road);


/* =========================
   خطوط وسط جاده
========================= */

const roadLines = [];

for(let i = 0; i < 40; i++){

  const geometry =
    new THREE.BoxGeometry(
      0.25,
      0.03,
      5
    );
  st material =
    new THREE.MeshBasicMaterial({
      color: 0xffffff
    });

  const line =
    new THREE.Mesh(
      geometry,
      material
    );

  line.position.set(
    0,
    0.03,
    -i * 13
  );

  scene.add(line);

  roadLines.push(line);
}


/* خطوط کناری */

function makeSideLine(x){

  const geometry =
    new THREE.BoxGeometry(
      0.35,
      0.05,
      500
    );

  const material =
    new THREE.MeshBasicMaterial({
      color: 0xffffff
    });

  const line =
    new THREE.Mesh(
      geometry,
      material
    );

  line.position.set(
    x,
    0.04,
    -150
  );

  scene.add(line);
}

makeSideLine(-10.5);
makeSideLine(10.5);


/* =========================
   ساختمان‌ها
========================= */

function createBuilding(x,z){

  const height =
    8 + Math.random() * 20;

  const width =
    4 + Math.random() * 5;

  const depth =
    4 + Math.random() * 5;

  const geometry =
    new THREE.BoxGeometry(
      width,
      height,
      depth
    );

  const material =
    new THREE.MeshLambertMaterial({
      color:
        new THREE.Color(
          0.25 + Math.random()*0.3,
          0.25 + Math.random()*0.3,
          0.28 + Math.random()*0.3
        )
    });

  const building =
    new THREE.Mesh(
      geometry,
      material
    );

  building.position.set(
    x,
    height/2,
    z
  );

  scene.add(building);
}

for(let i=0;i<25;i++){

  createBuilding(
    -18 - Math.random()*15,
    -i*18
  );

  createBuilding(
    18 + Math.random()*15,
    -i*18
  );
}


/* =========================
   ساخت پژو 405
========================= */

function createPeugeot(){

  const car = new THREE.Group();


  /* بدنه */

  const bodyGeometry =
    new THREE.BoxGeometry(
      2.3,
      0.65,
      4.2
    );

  const bodyMaterial =
    new THREE.MeshLambertMaterial({
      color: 0xe7e7e7
    });

  const body =
    new THREE.Mesh(
      bodyGeometry,
      bodyMaterial
    );

  body.position.y = 0.8;

  car.add(body);


  /* سقف */

  const roofGeometry =
    new THREE.BoxGeometry(
      1.85,
      0.65,
      2.2
    );

  const roofMaterial =
    new THREE.MeshLambertMaterial({
      color: 0xdcdcdc
    });

  const roof =
    new THREE.Mesh(
      roofGeometry,
      roofMaterial
    );

  roof.position.set(
    0,
    1.35,
    -0.15
  );

  car.add(roof);


  /* شیشه جلو */

  const glassGeometry =
    new THREE.BoxGeometry(
      1.65,
      0.45,
      0.08
    );

  const glassMaterial =
    new THREE.MeshLambertMaterial({
      color: 0x377a99
    });

  const frontGlass =
    new THREE.Mesh(
      glassGeometry,
      glassMaterial
    );

  frontGlass.position.set(
    0,
    1.37,
    -1.28
  );

  frontGlass.rotation.x =
    -0.15;

  car.add(frontGlass);


  /* شیشه عقب */

  const rearGlass =
    new THREE.Mesh(
      glassGeometry,
      glassMaterial
    );

  rearGlass.position.set(
    0,
    1.37,
    0.98
  );

  rearGlass.rotation.x =
    0.15;

  car.add(rearGlass);


  /* چرخ */

  function wheel(x,z){

    const geometry =
      new THREE.CylinderGeometry(
        0.38,
        0.38,
        0.28,
        20
      );

    const material =
      new THREE.MeshLambertMaterial({
        color: 0x111111
      });

    const w =
      new THREE.Mesh(
        geometry,
        material
      );

    w.rotation.z =
      Math.PI / 2;

    w.position.set(
      x,
      0.42,
      z
    );

    car.add(w);
  }

  wheel(-1.15,-1.25);
  wheel(1.15,-1.25);
  wheel(-1.15,1.25);
  wheel(1.15,1.25);


  /* چراغ */

  function light(x,z){

    const geometry =
      new THREE.BoxGeometry(
        0.45,
        0.18,
        0.08
      );

    const material =
      new THREE.MeshBasicMaterial({
        color: 0xffffaa
      });

    const l =
      new THREE.Mesh(
        geometry,
        material
      );

    l.position.set(
      x,
      0.85,
      z
    );

    car.add(l);
  }

  light(-0.65,-2.12);
  light(0.65,-2.12);


  return car;
}


/* ماشین بازیکن */

const player =
  createPeugeot();

player.position.set(
  0,
  0,
  5
);

scene.add(player);


/* ==============
===========
   ماشین‌های ترافیک
========================= */

const traffic = [];

const trafficColors = [
  0xff2222,
  0x222222,
  0x1565c0,
  0xffffff,
  0xffcc00
];


function createTrafficCar(){

  const car =
    createPeugeot();

  const color =
    trafficColors[
      Math.floor(
        Math.random()*trafficColors.length
      )
    ];

  car.traverse(obj=>{

    if(obj.isMesh &&
       obj.material &&
       obj.material.color){

      if(obj.material.color.r > 0.5 &&
         obj.material.color.g > 0.5 &&
         obj.material.color.b > 0.5){

        obj.material =
          obj.material.clone();

        obj.material.color.setHex(color);
      }
    }

  });


  const lanes = [-7,-3.5,3.5,7];

  car.position.x =
    lanes[
      Math.floor(
        Math.random()*lanes.length
      )
    ];

  car.position.y = 0;

  car.position.z =
    -80 - Math.random()*120;

  car.rotation.y = Math.PI;

  scene.add(car);

  traffic.push(car);
}


/* =========================
   کنترل
========================= */

const keys = {
  left:false,
  right:false,
  gas:false,
  brake:false
};


function setupButton(id,key){

  const button =
    document.getElementById(id);


  button.addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      keys[key]=true;
    },
    {passive:false}
  );


  button.addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      keys[key]=false;
    },
    {passive:false}
  );


  button.addEventListener(
    "touchcancel",
    ()=>{
      keys[key]=false;
    }
  );


  button.addEventListener(
    "mousedown",
    ()=>{
      keys[key]=true;
    }
  );


  button.addEventListener(
    "mouseup",
    ()=>{
      keys[key]=false;
    }
  );
}


setupButton("left","left");
setupButton("right","right");
setupButton("gas","gas");
setupButton("brake","brake");


/* کیبورد */

window.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft")
      keys.left=true;

    if(e.key==="ArrowRight")
      keys.right=true;

    if(e.key==="ArrowUp")
      keys.gas=true;

    if(e.key==="ArrowDown")
      keys.brake=true;

  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(e.key==="ArrowLeft")
      keys.left=false;

    if(e.key==="ArrowRight")
      keys.right=false;

    if(e.key==="ArrowUp")
      keys.gas=false;

    if(e.key==="ArrowDown")
      keys.brake=false;

  }
);


/* =========================
   متغیرهای بازی
========================= */

let speed = 0;
let score = 0;
let gameRunning = true;


/* =========================
   برخورد
========================= */

function checkCollision(a,b){

  const distance =
    a.position.distanceTo(
      b.position
    );

  return distance < 2.8;
}


/* =========================
   بازی
========================= */

function animate(){

  requestAnimationFrame(animate);

  if(!gameRunning){

    renderer.render(
      scene,
      camera
    );

    return;
  }


  /* شتاب */

  if(keys.gas){

    speed += 0.025;

  }else{

    speed *= 0.985;

  }


  /* ترمز */

  if(keys.brake){

    speed -= 0.07;

  }


  speed =
    Math.max(
      0,
      Math.min(
        speed,
        1.3
      )
    );


  /* فرمان */

  if(keys.left){

    player.position.x -=
      0.12 + speed*0.04;

  }


  if(keys.right){

    player.position.x +=
      0.12 + speed*0.04;

  }


  /* محدودیت جاده */

  player.position.x =
    Math.max(
      -8.8,
      Math.min(
        8.8,
        player.position.x
      )
    );


  /* حرکت جاده */

  roadLines.forEach(line=>{

    line.position.z +=
      speed * 4;

    if(line.position.z > 15){

      line.position.z -= 520;

    }

  });


  /* حرکت ترافیک */

  traffic.forEach((car,index)=>{

    car.position.z +=
      speed * 3.2 + 0.25;


    if(
      checkCollision(
        player,
        car
      )
    ){

      gameOver();

    }


    if(car.position.z > 30){

      car.position.z =
        -180 -
        Math.random()*80;

      const lanes =
        [-7,-3.5,3.5,7];

      car.position.x =
        lanes[
          Math.floor(
            Math.random()*lanes.length
            )
        ];

      score += 10;

    }

  });


  /* دوربین */

  camera.position.x +=
    (player.position.x*0.35 -
     camera.position.x)*0.08;

  camera.lookAt(
    player.position.x,
    1,
    -25
  );


  /* HUD */

  document.getElementById(
    "speed"
  ).textContent =
    Math.round(speed*110);

  document.getElementById(
    "score"
  ).textContent =
    score;


  renderer.render(
    scene,
    camera
  );
}


/* ماشین‌های اولیه */

for(let i=0;i<7;i++){

  createTrafficCar();

}


/* ساخت ترافیک بیشتر */

setInterval(()=>{

  if(gameRunning &&
     traffic.length < 10){

    createTrafficCar();

  }

},1200);


/* =========================
   پایان بازی
========================= */

function gameOver(){

  gameRunning=false;

  document.getElementById(
    "finalScore"
  ).textContent =
    score;

  document.getElementById(
    "gameOver"
  ).style.display =
    "block";
}


/* دوباره */

document.getElementById(
  "restart"
).addEventListener(
  "click",
  ()=>{
    location.reload();
  }
);


/* تغییر اندازه صفحه */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* شروع */

animate();

</script>

</body>
</html>
